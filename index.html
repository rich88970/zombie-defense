<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>殭屍防守</title>
<style>
:root{--bg:#12161c;--panel:#1d232b;--panel2:#262e37;--line:#3a4450;--text:#e6ebf0;--dim:#93a0ad;--accent:#3ad6b0;--warn:#ff5a4f;--gold:#f2c14e;--q1:#5fcf6b;--q2:#4aa3ff;--q3:#b77cff;--q4:#f2c14e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit}
#app{position:fixed;inset:0}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:linear-gradient(#232a33,#191e25);z-index:4}
#top{top:0;height:46px;border-bottom:1px solid #000}
#bottom{bottom:0;height:76px;border-top:1px solid #000}
#stage{position:absolute;left:0;right:0;top:46px;bottom:76px;overflow:hidden;background:#0c0f13}
#app.nohud #top,#app.nohud #bottom{display:none}
#app.nohud #stage{top:0;bottom:0}
#cv{position:absolute;left:0;top:0;display:block;cursor:crosshair}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.lbl{color:var(--dim);font-size:12px}
.num{font-variant-numeric:tabular-nums;font-size:15px}
.hpbar{position:relative;width:150px;height:16px;background:#0e1115;border:1px solid #3a4450;border-radius:3px;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#2fc6a4}
.hpbar.core i{background:#4fb3ff}
.hpbar.low i{background:#e0473d}
.hpbar b{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;color:#fff;text-shadow:0 1px 1px #000;font-weight:normal}
.grow{flex:1}
#saveState{max-width:42vw;white-space:nowrap;overflow:hidden}
#saveState .warnText{display:inline-block;max-width:260px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.dim{color:var(--dim)}
.btn{background:#2c3540;color:var(--text);border:1px solid #46525f;border-radius:6px;padding:8px 14px;cursor:pointer;line-height:1.25}
.btn:hover:not(:disabled){background:#36414e;border-color:var(--accent)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:#1d6b5b;border-color:#3ad6b0}
.btn.danger{background:#5e2622;border-color:#c9483f}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.wide{width:100%}
.btn.on{border-color:var(--accent);background:#20463f}
.screen{position:absolute;inset:0;background:rgba(9,11,15,.80);display:flex;align-items:center;justify-content:center;z-index:20}
#modal{z-index:30;background:rgba(5,6,9,.7)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:min(1120px,95vw);max-height:94vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h1{margin:0 0 4px;font-size:34px;letter-spacing:2px}
.card h2{margin:0 0 12px;font-size:22px}
.card h3{margin:14px 0 8px;font-size:16px;color:#cfe}
.card p{margin:6px 0;line-height:1.55}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
.box.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.box.click{cursor:pointer}
.box.click:hover{border-color:#6c7c8c}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#33404d;margin-right:4px}
.q1{border-color:var(--q1)!important}.q2{border-color:var(--q2)!important}.q3{border-color:var(--q3)!important}.q4{border-color:var(--q4)!important}
.tq1{color:var(--q1)}.tq2{color:var(--q2)}.tq3{color:var(--q3)}.tq4{color:var(--q4)}
.warnText{color:#ff9b93}
.okText{color:#7fe6c8}
.gold{color:var(--gold)}
table.t{border-collapse:collapse;font-size:12.5px;width:100%}
table.t td,table.t th{border-bottom:1px solid #313b46;padding:4px 6px;text-align:left;white-space:nowrap}
table.t th{color:var(--dim);font-weight:normal}
.side{position:absolute;top:8px;width:232px;background:rgba(22,27,34,.92);border:1px solid #3a4450;border-radius:8px;padding:10px;font-size:13px;z-index:5;line-height:1.45}
.side h4{margin:0 0 6px;font-size:15px}
.side .btn{margin-top:6px}
#sideL{left:8px}
#sideR{right:8px}
.side.atB{top:auto;bottom:8px}
.side{max-height:calc(100% - 16px);overflow:auto}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv span:first-child{color:var(--dim)}
.sep{height:1px;background:#33404c;margin:8px 0}
#build{display:flex;gap:6px;flex:1;justify-content:center;min-width:0}
.tbtn{width:92px;height:64px;background:#222a33;border:1px solid #46525f;border-radius:7px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative;cursor:pointer;padding:2px}
.tbtn:hover:not(.dis){border-color:#7d8c9b}
.tbtn img{width:30px;height:30px}
.tbtn.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tbtn.dis{opacity:.45;cursor:not-allowed}
.tbtn .k{position:absolute;left:5px;top:2px;font-size:10px;color:var(--dim)}
.tbtn .c{color:var(--gold)}
#weapons{display:flex;gap:6px;width:340px;flex:none}
.wslot{flex:1;border:2px solid #444;border-radius:7px;padding:4px 8px;background:#1a1f26;font-size:12px;opacity:.55;min-width:0}
.wslot.on{opacity:1;background:#1f262f}
.wslot .ammo{font-size:17px;font-weight:bold;font-variant-numeric:tabular-nums}
.rbar{height:3px;background:#30363d;margin-top:3px;border-radius:2px;overflow:hidden}
.rbar i{display:block;height:100%;background:#f2c14e;width:0}
#hint{width:280px;flex:none;font-size:12px;text-align:right;color:var(--dim);line-height:1.4}
#bossbar{pointer-events:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(520px,46%);z-index:6;text-align:center;font-size:14px;text-shadow:0 1px 2px #000}
.bbar{height:14px;background:#1a0d0d;border:1px solid #8a2f2f;border-radius:3px;overflow:hidden;margin-top:3px}
.bbar i{display:block;height:100%;background:#d23c32;width:100%}
#banner{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:bold;padding:10px 26px;background:rgba(15,18,23,.86);border:1px solid #3a4450;border-radius:8px;z-index:6;pointer-events:none;text-align:center;white-space:nowrap}
#banner small{display:block;font-size:14px;font-weight:normal;color:var(--dim);margin-top:4px}
#toast{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:7;align-items:flex-end;pointer-events:none}
#toast div{background:rgba(20,24,30,.94);border:1px solid #3a4450;padding:6px 12px;border-radius:6px;font-size:13px}
#toast div.err{border-color:var(--warn);color:#ffc0ba}
#fps{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:#8a96a3;z-index:6;pointer-events:none}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1}
.mini{font-size:12px;color:var(--dim)}
.wcard{position:relative}
.wcard .lock{position:absolute;right:8px;top:6px;font-size:11px}
.danger-zone{border-color:#6b2f2b}
.slotbar{display:flex;gap:10px;align-items:center;margin:4px 0 14px;flex-wrap:wrap}
.slot{position:relative;min-width:180px;padding:8px 14px;border:2px dashed #4a5663;border-radius:8px;background:#1a2028;line-height:1.5}
.slot.full{border-style:solid;background:#1f262f}
.slot.need{border-color:#3ad6b0;color:#7fe6c8;animation:needPulse 1.6s ease-in-out infinite}
@keyframes needPulse{50%{border-color:#1d6b5b}}
@media (prefers-reduced-motion:reduce){.slot.need{animation:none}}
.slot b{font-size:16px}
.slot .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--dim);padding:2px 4px}
.slot .x:hover{color:#fff}
@media (max-width:1100px){#hint{display:none}#weapons{width:280px}.tbtn{width:78px}}
</style>
</head>
<body>
<div id="app" class="nohud">
  <div id="top" class="bar">
    <div class="stat"><span class="lbl">玩家</span><div class="hpbar" id="hpPb"><i id="hpP"></i><b id="hpPt"></b></div></div>
    <div class="stat"><span class="lbl">核心</span><div class="hpbar core" id="hpCb"><i id="hpC"></i><b id="hpCt"></b></div></div>
    <div class="stat"><span class="lbl">點數</span><b id="pts" class="num gold">0</b></div>
    <div class="stat"><span class="lbl">波次</span><b id="wave" class="num">1/15</b></div>
    <div class="stat"><span class="lbl">剩餘敵數</span><b id="left" class="num">0</b></div>
    <div class="stat"><span class="lbl">防禦塔</span><b id="tcount" class="num">0/15</b></div>
    <div class="grow"></div>
    <div id="saveState" class="mini"></div>
    <button id="btnPause" class="btn sm" data-act="pause">暫停 (Esc)</button>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="殭屍防守戰場"></canvas>
    <div id="bossbar" class="hidden"><div id="bossName"></div><div class="bbar"><i id="bossHp"></i></div></div>
    <div id="banner" class="hidden" aria-live="polite"></div>
    <div id="sideL" class="side hidden"></div>
    <div id="sideR" class="side hidden"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="fps" class="hidden"></div>
  </div>
  <div id="bottom" class="bar">
    <div id="weapons"></div>
    <div id="build"></div>
    <div id="hint"></div>
  </div>
  <div id="screen" class="screen"></div>
  <div id="modal" class="screen hidden"></div>
  <input type="file" id="fileIn" accept=".json,application/json" class="hidden">
</div>
<script>
'use strict';
/* =====================================================================
 * 殭屍防守 — 單檔網頁版
 * 依《殭屍防守遊戲規劃書 v6》實作：Canvas 畫戰場、HTML 呈現選單與 HUD。
 * 效能原則：固定步長模擬、靜態地圖預先繪製、精靈圖快取、物件池、
 *           HUD 只在數值改變時更新 DOM、暫停／選單時不重繪。
 * ===================================================================== */

// ---------- 基本工具 ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Math.ceil(n).toLocaleString('en-US');
const n2 = n => (Math.round(n * 100) / 100).toFixed(2);
const clone = o => JSON.parse(JSON.stringify(o));
function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

// 可存檔的亂數產生器（mulberry32）：狀態只有一個整數，可寫進檢查點
class RNG {
  constructor(s) { this.s = s >>> 0; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + (b - a) * this.next(); }
}

// 線段與矩形相交：回傳進入參數 t（0~1），不相交回傳 -1（用於視線與彈道遮擋）
function segRect(x1, y1, x2, y2, r) {
  const dx = x2 - x1, dy = y2 - y1; let t0 = 0, t1 = 1;
  if (dx === 0) { if (x1 < r.x || x1 > r.x + r.w) return -1; }
  else { let a = (r.x - x1) / dx, b = (r.x + r.w - x1) / dx; if (a > b) { const t = a; a = b; b = t; } if (a > t0) t0 = a; if (b < t1) t1 = b; if (t0 > t1) return -1; }
  if (dy === 0) { if (y1 < r.y || y1 > r.y + r.h) return -1; }
  else { let a = (r.y - y1) / dy, b = (r.y + r.h - y1) / dy; if (a > b) { const t = a; a = b; b = t; } if (a > t0) t0 = a; if (b < t1) t1 = b; if (t0 > t1) return -1; }
  return t0;
}
function circleRect(cx, cy, cr, r) { const nx = clamp(cx, r.x, r.x + r.w), ny = clamp(cy, r.y, r.y + r.h); return d2(cx, cy, nx, ny) < cr * cr; }
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }
// 射線與圓：dx,dy 為單位向量，回傳命中距離或 -1
function rayCircle(x, y, dx, dy, len, cx, cy, cr) {
  const fx = cx - x, fy = cy - y, p = fx * dx + fy * dy;
  if (p < -cr || p > len + cr) return -1;
  const qx = fx - p * dx, qy = fy - p * dy, q = qx * qx + qy * qy;
  if (q > cr * cr) return -1;
  const t = p - Math.sqrt(cr * cr - q); return t < 0 ? 0 : t;
}
const R = (x, y, w, h) => ({ x, y, w, h });

// ---------- 全域常數 ----------
const SCHEMA_VERSION = 1, BALANCE_VERSION = 7;
const WORLD_W = 1600, WORLD_H = 1000;
const MAX_TOWERS = 15, MAX_ALIVE = 36, BOSS_PLAYER_MUL = 2.05;
const PLAYER_MAX_HP = 200, CORE_MAX_HP = 1500, START_POINTS = 420;
const PLAYER_SPEED = 100, PLAYER_R = 11, TOWER_R = 16;
const QUAL = [null, { name: '綠', c: '#5fcf6b' }, { name: '藍', c: '#4aa3ff' }, { name: '紫', c: '#b77cff' }, { name: '金', c: '#f2c14e' }];

// ---------- 武器（規劃書 5.1） ----------
const WEAPONS = {
  pistol: { name: '手槍', q: 1, dmg: 14, rps: 4, mag: 12, reload: 1.4, cost: 0, semi: true, range: 520, spread: 0.025, fx: 'bullet', desc: '換彈短的備用武器；每秒 4 發為連點上限（需逐次點擊）。' },
  rifle: { name: '步槍', q: 1, dmg: 12, rps: 7, mag: 28, reload: 1.8, cost: 0, range: 560, spread: 0.04, fx: 'bullet', desc: '穩定連發，初期主要輸出。' },
  shotgun: { name: '散彈槍', q: 2, dmg: 16, pellets: 8, rps: 1.2, mag: 6, reload: 2.4, cost: 140, range: 330, spread: 0.30, full: 140, fx: 'pellet', desc: '扇形 8 顆彈丸；140 u 內打滿，距離越遠傷害越低。' },
  ice: { name: '冰槍', q: 2, dmg: 24, rps: 7, mag: 28, reload: 2, cost: 180, range: 480, spread: 0.035, slow: 0.3, slowDur: 2, fx: 'ice', desc: '命中減速 30%、持續 2 秒，重複命中只刷新。' },
  fire: { name: '火槍', q: 3, dmg: 40, rps: 8, mag: 32, reload: 2, cost: 380, range: 360, spread: 0.05, burn: 10, burnDur: 3, fx: 'fire', desc: '命中附加每秒 10、持續 3 秒灼燒，同來源不疊層。' },
  shock: { name: '電槍', q: 3, dmg: 48, rps: 6, mag: 30, reload: 2, cost: 420, range: 460, spread: 0.03, chain: 2, chainMul: 0.4, hop: 110, fx: 'shock', desc: '命中後跳向最多 2 名附近敵人，各受 40%，不跳回同一敵。' },
  sniper: { name: '狙擊槍', q: 3, dmg: 402.5, rps: 0.9, mag: 6, reload: 2.8, cost: 460, range: 1400, spread: 0.004, fx: 'snipe', desc: '遠距高單發，點殺自爆及厚敵，近身清群較慢。' },
  hmg: { name: '重機槍', q: 4, dmg: 50, rps: 10, mag: 60, reload: 3, cost: 850, range: 580, spread: 0.05, moveMul: 0.8, fx: 'bullet', desc: '高持續單體輸出，射擊時玩家移速降低 20%。' },
  rocket: { name: '火箭筒', q: 4, dmg: 528, rps: 0.8, mag: 4, reload: 3.2, cost: 900, range: 800, spread: 0.01, radius: 70, splash: 4, splashMul: 0.5, projSpeed: 560, fx: 'rocket', desc: '直擊 528 傷害，爆炸半徑 70，另最多 4 名敵人各受 50%。' },
  rail: { name: '磁軌槍', q: 4, dmg: 736, rps: 0.7, mag: 5, reload: 3, cost: 950, range: 1400, spread: 0.003, pierce: [1, 0.7, 0.5], fx: 'rail', desc: '蓄力包含在發射間隔內，最多貫穿 3 敵（100%／70%／50%），遇實牆終止。' },
};
const WEAPON_SHORT = { pistol: '備用手槍', rifle: '穩定連發', shotgun: '近距散射', ice: '命中減速', fire: '附帶灼燒', shock: '電流跳躍', sniper: '遠距高傷', hmg: '高速連射', rocket: '爆炸範圍', rail: '貫穿多敵' };
const WEAPON_ORDER = ['pistol', 'rifle', 'shotgun', 'ice', 'fire', 'shock', 'sniper', 'hmg', 'rocket', 'rail'];
for (const k in WEAPON_SHORT) WEAPONS[k].short = WEAPON_SHORT[k];
const weaponDps = w => w.dmg * (w.pellets || 1) * w.mag / (w.mag / w.rps + w.reload);

// ---------- 防禦塔（規劃書 6） ----------
const TOWERS = {
  mg: { name: '機槍塔', cost: 180, hp: 350, range: 240, dmg: 12, interval: 1 / 3, unlock: 0, group: false, info: '每發 12，每秒 3 發，單體連射',
    A: { name: '長射', desc: '射程 +15%' }, B: { name: '雙槍', desc: '打兩名不同敵人，各路傷害 60%；單敵只開一路' } },
  cannon: { name: '砲塔', cost: 240, hp: 450, range: 280, dmg: 100, interval: 2.5, radius: 55, maxT: 5, unlock: 0, group: true, info: '每 2.5 秒 100，半徑 55 最多 5 目標',
    A: { name: '重彈', desc: '中心傷害 +20%，其他敵人傷害 ×0.8' }, B: { name: '大爆', desc: '半徑 +25%，所有傷害 ×0.85' } },
  ice: { name: '冰塔', cost: 200, hp: 350, range: 220, dmg: 20, interval: 0.25, maxT: 2, slow: 0.3, unlock: 0, group: true, info: '每秒 20，冰線最多 2 目標，減速 30% 持續 2 秒',
    A: { name: '深凍', desc: '減速提高到 40%' }, B: { name: '長冰', desc: '射程 +25%，減速維持 30%' } },
  fire: { name: '火塔', cost: 240, hp: 350, range: 150, dmg: 22, interval: 0.5, maxT: 4, angle: 60, unlock: 160, group: true, info: '每 0.5 秒 22，扇形最多 4 目標',
    A: { name: '餘火', desc: '離開火線後每秒 3 傷害，持續 3 秒' }, B: { name: '寬焰', desc: '扇形角度 +25%，射程 -15%' } },
  sniper: { name: '狙擊塔', cost: 300, hp: 300, range: 380, dmg: 130, interval: 2, unlock: 220, group: false, info: '每 2 秒 130，遠距單體',
    A: { name: '重擊', desc: '傷害 +20%，攻擊間隔 +10%' }, B: { name: '雙發', desc: '打兩名不同敵人，各受 65%；單敵只打一發' } },
  tesla: { name: '電塔', cost: 320, hp: 320, range: 230, dmg: 45, interval: 1, maxT: 3, hop: 70, unlock: 300, group: true, info: '每秒放電 45，最多 3 目標，每跳 ≤70 u',

// =====================================================================
// 戰鬥模擬（固定步長 1/60 秒；傷害、射速、狀態全以模擬時間計算，不受畫面掉幀影響）
// =====================================================================
let G = null;
const STEP = 1 / 60;
const MAX_CORPSES = () => Settings.lowFx ? 4 : 12;
const MAX_PARTS = () => Settings.lowFx ? 80 : 250;
const MAX_NUMS = 30;

function newRunData(mapId, diff, weapons) {
  const seed = (Math.random() * 4294967296) >>> 0;
  return {
    runId: makeId(), mapId, diff, wave: 1, phase: 'prep', prepLeft: prepTime(1), points: START_POINTS,
    playerHp: PLAYER_MAX_HP, coreHp: CORE_MAX_HP, weapons: weapons.slice(), mags: weapons.map(id => WEAPONS[id].mag), cur: 0,
    towers: [], coreRepaired: false, nextTowerId: 1, seed, rngState: seed, stats: emptyStats(), status: 'active',
    schemaVersion: SCHEMA_VERSION, balanceVersion: BALANCE_VERSION, startedAt: Date.now(),
  };
}

function createGame(run, mode) {
  const map = MAPS[run.mapId];
  G = {
    mode, run, map, lanes: map.lanes.map(buildLane), time: 0, paused: false, speed: 1,
    phase: 'prep', prepLeft: run.prepLeft, prepSaveT: 5, over: false,
    player: { kind: 'player', x: map.start.x, y: map.start.y, r: PLAYER_R, hp: run.playerHp, ang: 0, cur: run.cur, weapons: run.weapons.slice(), mags: run.mags.slice(),
      cd: 0, cds: [0, 0], reloadT: 0, reloadMax: 1, switchT: 0, fireHold: 0, hurtT: 0, step: 0, muzzle: 0, recoil: 0, shotN: 0 },
    core: { kind: 'core', x: map.core.x, y: map.core.y, r: map.core.r, hp: run.coreHp, hurtT: 0 },
    towers: [], enemies: [], bombs: [], shells: [], rockets: [], pools: [], warns: [],
    tracers: [], parts: [], rings: [], bolts: [], nums: [], corpses: [],
    spawnList: [], spawnIdx: 0, spawnClock: 0, bossPending: null, boss: null, aliveNormal: 0,
    rng: new RNG(run.rngState), steam: { timer: 18, zone: -1, phase: 'idle', t: 0, tick: 0 }, poisonTick: 0.5,
    walls: [], open: [], gateVer: 0, nextEid: 1, selected: null, placing: null, preview: null,
    shake: 0, sx: 0, sy: 0, hurtFlash: 0, range: null,
  };
  for (const t of run.towers) {
    const tw = { kind: 'tower', id: t.id, type: t.type, x: t.x, y: t.y, lv: t.lv, br: t.br, hp: t.hp, mode: t.mode, invested: t.invested,
      cd: 0, retarget: 0, targets: [], ang: -Math.PI / 2, onPlat: false, s: null, beamT: 0, flash: 0, recoil: 0, vis: null, tracerN: 0 };
    tw.onPlat = map.platforms.some(p => inRect(tw.x, tw.y, p)); tw.s = towerStats(tw); G.towers.push(tw);
  }
  applyGates(run.wave, false);
  clearDecals();
  return G;
}

// 依波次套用閘門，閉合的閘門視為實牆
function applyGates(w, announce) {
  const open = G.map.gateOpen(w);
  const changed = open.join() !== G.open.join();
  G.open = open;
  G.walls = G.map.walls.concat(G.map.gates.filter(gt => !open.includes(gt.lane)).map(gt => gt.r));
  if (changed) {
    G.gateVer++; Render.mapDirty = true;
    for (const t of G.towers) t.vis = null;
    if (announce && G.map.gates.length) UI.banner('閘門改道', '開放：' + open.map(i => G.lanes[i].name).join('、'), 4);
  }
}

// ---------- 幾何查詢 ----------
function los(x1, y1, x2, y2) {
  const minx = x1 < x2 ? x1 : x2, maxx = x1 < x2 ? x2 : x1, miny = y1 < y2 ? y1 : y2, maxy = y1 < y2 ? y2 : y1;
  const W = G.walls;
  for (let i = 0; i < W.length; i++) { const w = W[i]; if (w.x > maxx || w.x + w.w < minx || w.y > maxy || w.y + w.h < miny) continue; if (segRect(x1, y1, x2, y2, w) >= 0) return false; }
  return true;
}
function wallT(x1, y1, x2, y2) {
  let t = 1; const minx = Math.min(x1, x2), maxx = Math.max(x1, x2), miny = Math.min(y1, y2), maxy = Math.max(y1, y2);
  for (const w of G.walls) { if (w.x > maxx || w.x + w.w < minx || w.y > maxy || w.y + w.h < miny) continue; const tt = segRect(x1, y1, x2, y2, w); if (tt >= 0 && tt < t) t = tt; }
  return t;
}
// 射程預覽的可視多邊形（顯示遮擋，不把牆後算成有效射界）
function visPoly(x, y, R) {
  const n = 120, pts = new Float32Array(n * 2), near = G.walls.filter(w => circleRect(x, y, R, w));
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, ex = x + Math.cos(a) * R, ey = y + Math.sin(a) * R; let t = 1;
    for (const w of near) { const tt = segRect(x, y, ex, ey, w); if (tt >= 0 && tt < t) t = tt; }
    pts[i * 2] = x + (ex - x) * t; pts[i * 2 + 1] = y + (ey - y) * t;
  }
  return pts;
}
function pushOut(o, w) {
  const nx = clamp(o.x, w.x, w.x + w.w), ny = clamp(o.y, w.y, w.y + w.h); const dx = o.x - nx, dy = o.y - ny, dd = dx * dx + dy * dy;
  if (dd >= o.r * o.r) return;
  if (dd > 1e-6) { const d = Math.sqrt(dd); o.x = nx + dx / d * o.r; o.y = ny + dy / d * o.r; }
  else { const l = o.x - w.x, r = w.x + w.w - o.x, t = o.y - w.y, b = w.y + w.h - o.y, m = Math.min(l, r, t, b);
    if (m === l) o.x = w.x - o.r; else if (m === r) o.x = w.x + w.w + o.r; else if (m === t) o.y = w.y - o.r; else o.y = w.y + w.h + o.r; }
}
function resolvePlayer(o) {
  for (const w of G.walls) pushOut(o, w);
  for (const p of G.map.pits) pushOut(o, p);
  const C = G.core;
  if (C.r) { const dx = o.x - C.x, dy = o.y - C.y, rr = C.r + o.r, dd = dx * dx + dy * dy; if (dd < rr * rr && dd > 0) { const d = Math.sqrt(dd); o.x = C.x + dx / d * rr; o.y = C.y + dy / d * rr; } }
  o.x = clamp(o.x, o.r, WORLD_W - o.r); o.y = clamp(o.y, o.r, WORLD_H - o.r);
}
function conveyorMul(x, y, dx, dy) {
  for (const c of G.map.conveyors) if (inRect(x, y, c.r)) { const dot = dx * c.dx + dy * c.dy; return dot > 0.5 ? 1.2 : dot < -0.5 ? 0.8 : 1; }
  return 1;
}
function lerpAng(a, b, k) { return a + angDiff(b, a) * k; }

// ---------- 特效（物件池上限，超出只省略裝飾，不影響傷害） ----------
function addPart(x, y, vx, vy, life, size, color, kind) {
  if (G.parts.length >= MAX_PARTS()) return;
  G.parts.push({ x, y, vx, vy, t: 0, life, size, color, kind: kind || 0 });
}
function burst(x, y, n, color, speed, life, size) {
  if (Settings.lowFx) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7); addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, life * (0.6 + Math.random() * 0.4), size, color); }
}
function addTracer(x1, y1, x2, y2, color, w, life) { if (G.tracers.length < 80) G.tracers.push({ x1, y1, x2, y2, color, w, t: 0, life }); }
function addRing(x, y, r, color, life, fill) { if (G.rings.length < 40) G.rings.push({ x, y, r, color, t: 0, life, fill: !!fill }); }
function addWarn(x, y, r, dur, color, kind) { G.warns.push({ x, y, r, t: 0, dur, color, kind: kind || 'circle' }); }
function addShake(a) { if (Settings.reduceMotion || !Settings.shake) return; G.shake = Math.min(10, Math.max(G.shake, a * (Settings.shake === 2 ? 1 : 0.5))); }
function addNum(e, amt, src) {
  if (!Settings.numbers) return;
  const n = e.num;
  if (n && n.t < 0.15 && n.src === src) { n.v += amt; return; }   // 同目標 0.15 秒內合併
  if (G.nums.length >= MAX_NUMS) return;
  const m = { x: e.x + (Math.random() - .5) * 8, y: e.y - e.r - 4, v: amt, src, t: 0, life: 0.8 };
  G.nums.push(m); e.num = m;

// ---------- 傷害結算 ----------

function updateEnemy(e, dt) {

const App = { mode: 'menu', dirty: true, sel: { map: 'street', diff: 'easy', weapons: ['pistol', 'rifle'] }, rangeFrom: 'menu', slowWarned: false };
const Input = { k: { up: false, down: false, left: false, right: false }, wx: 800, wy: 500, down: false, clicks: 0, shift: false, inCanvas: false };
const KEYMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
const playing = () => G && (App.mode === 'game' || App.mode === 'range') && !G.paused && !G.over;

function mouseWorld(e) {
  const r = cv.getBoundingClientRect();
  Input.wx = ((e.clientX - r.left) * V.dpr - V.ox) / V.k; Input.wy = ((e.clientY - r.top) * V.dpr - V.oy) / V.k;

window.addEventListener('mousemove', e => { mouseWorld(e); Input.inCanvas = e.target === cv; });
cv.addEventListener('mouseleave', () => { Input.inCanvas = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  Snd.init(); mouseWorld(e); Input.inCanvas = true;
  if (!playing()) return;
  if (e.button === 2) { if (G.placing) { G.placing = null; UI.refreshAll(); } else if (G.selected) UI.select(null); return; }
  if (e.button !== 0) return;
  if (G.placing) { tryPlace(Input.wx, Input.wy); return; }          // 放置模式：點擊確認，不開槍
  const t = towerAt(Input.wx, Input.wy);
  if (t) { UI.select(t); return; }                                   // 點塔：開管理面板，不開槍
  Input.down = true; Input.clicks = 1; Input.clickT = G.time;
});
window.addEventListener('mouseup', e => { if (e.button === 0) Input.down = false; });
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  Input.shift = e.shiftKey;
  const m = KEYMAP[e.code];
  if (m) { Input.k[m] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); }
  if (e.code === 'Escape') { onEsc(); return; }
  if (!playing() || e.repeat) return;
  if (e.code === 'KeyR') startReload();
  else if (e.code === 'Digit1') switchWeapon(0);
  else if (e.code === 'Digit2') switchWeapon(1);
  else if (/^Digit[3-8]$/.test(e.code)) { const type = TOWER_ORDER[+e.code.slice(5) - 3]; UI.pickBuild(type); }

// 切換分頁自動暫停，回來後要主動點擊才繼續
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; if (playing()) UI.pause(); if (G && G.mode === 'game' && G.phase === 'prep' && !G.over && !Store.stale) saveCheckpoint(); });

    setTimeout(() => {
      this.show('<h2>' + (win ? '🏆 勝利' : '💀 失敗') + '</h2><p>' + esc(reason) + '</p>' +
        '<p>' + MAPS[r.mapId].name + '・' + DIFFS[r.diff].name + '｜完成 <b>' + waves + '</b> / 15 波｜本局零件 <b class="gold">+' + s.partsEarned + '</b>' + (first ? '（含首次通關 +' + first + '）' : '') + '｜目前零件 ' + nf(Store.profile.parts) + '</p>' +
        '<h3>有效傷害（依實際扣血記帳，不含過量傷害）</h3><table class="t"><tr><th>來源</th><th>一般敵人</th><th>Boss</th><th>合計</th></tr>' +
        row('玩家', D.player) + row('防禦塔', D.tower) + row('環境（蒸汽等）', D.env) + '</table>' +
        '<p class="mini">占比：玩家 ' + pct(D.player.normal + D.player.boss) + '｜塔 ' + pct(D.tower.normal + D.tower.boss) + '｜環境 ' + pct(D.env.normal + D.env.boss) + '</p>' +
        '<table class="t"><tr><th>核心損失</th><th>被拆塔數</th><th>修理費</th><th>擊殺</th><th>建造數</th><th>玩家受傷</th></tr><tr><td>' + nf(s.coreLost) + '</td><td>' + s.towersLost + '</td><td>' + s.repairSpent + '</td><td>' + s.kills + '</td><td>' + s.built + '</td><td>' + nf(s.playerHurt) + '</td></tr></table>' +
        (Store.dirty ? '<p class="warnText">⚠ 結算存檔失敗：' + esc(Store.lastError) + ' <button class="btn sm" data-act="retrySave">重試</button> <button class="btn sm" data-act="export">匯出備份</button></p>' : '<p class="mini">' + (win ? '通關與首次獎勵已在同一交易入帳，重新整理不會重複發放。' : '已完成波次的零件已入帳保留；本局已結束，不能從死亡前續命。') + '</p>') +
        '<div class="row" style="margin-top:14px"><button class="btn" data-act="endOk">回主選單</button><button class="btn primary" data-act="again">再來一局</button></div>', true);
      if (G) G.paused = true; App.dirty = true;   // 結算畫面出現後停止背景模擬與重繪
    }, 900);
  },
};

// =====================================================================
// 主迴圈：固定步長累積器；選單與暫停時不持續重繪（省電）
// =====================================================================
const Perf = { last: performance.now(), acc: 0, hudT: 0, frames: 0, work: 0, fpsT: 0, slowT: 0, fps: 60, ms: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - Perf.last) / 1000; Perf.last = now; if (dt > 0.25) dt = 0.25;
  const active = G && (App.mode === 'game' || App.mode === 'range');
  if (active && !G.paused) {
    const t0 = performance.now();
    Perf.acc += dt * G.speed; let n = 0; const maxN = 8 * G.speed;
    while (Perf.acc >= STEP && n < maxN) { update(STEP); Perf.acc -= STEP; n++; if (!G) return; }
    if (n >= maxN) Perf.acc = 0;   // 嚴重掉幀時放棄追趕，避免卡死
    if (n > 0 || App.dirty) { render(); Perf.work += performance.now() - t0; Perf.frames++; }
    Perf.hudT -= dt; if (Perf.hudT <= 0) { Perf.hudT = 0.1; UI.hud(); }
    App.dirty = false;
  } else if (App.dirty) { render(); App.dirty = false; if (active) UI.hud(); }
  Perf.fpsT += dt;
  if (Perf.fpsT >= 1) {
    Perf.fps = Perf.frames / Perf.fpsT; Perf.ms = Perf.frames ? Perf.work / Perf.frames : 0;
    if (Settings.fps) setText(UI.el.fps, active && !G.paused ? 'FPS ' + Perf.fps.toFixed(0) + '｜模擬＋繪圖 ' + Perf.ms.toFixed(2) + ' ms｜敵 ' + G.enemies.length + '｜塔 ' + G.towers.length + '｜粒子 ' + G.parts.length : '');
    if (active && !G.paused && Perf.frames > 10 && Perf.ms > 12 && !Settings.lowFx) { Perf.slowT++; if (Perf.slowT >= 5 && !App.slowWarned) { App.slowWarned = true; UI.toast('畫面偏慢：可在「設定」開啟低特效'); } } else Perf.slowT = 0;
    Perf.frames = 0; Perf.work = 0; Perf.fpsT = 0;
  }
}

// 除錯用（不影響遊戲）：在主控台用 ZD.G 檢視狀態
window.ZD = { get G() { return G; }, Store, App, UI, Settings, Perf, MAPS, WAVES, waveParts, partsUpTo };

(async function boot() {
  loadSettings();
  UI.init();
  UI.el.fps.classList.toggle('hidden', !Settings.fps);
  resize();
  let rsT = 0; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(resize, 150); });
  await Store.init();
  UI.showMenu();
  requestAnimationFrame(t => { Perf.last = t; frame(t); });
})();
</script>
